<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>Categoria — Catálogo de Camisas</title>
  <meta name="description" content="Veja todos os modelos disponíveis por categoria.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loja.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>👕</text></svg>">
</head>
<body>

  <main>
    <div class="pagehead">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Início</a> / <span id="crumbAtual">Catálogo</span></div>
        <h1 id="tituloPagina">Catálogo</h1>
        <p class="pagehead__count" id="contador"></p>
      </div>
    </div>

    <div class="wrap">
      <div class="chips" id="chips"></div>

      <div class="toolbar">
        <span style="font-size:13px;color:var(--txt-3)" id="resumo"></span>
        <select class="select" id="ordenar" aria-label="Ordenar">
          <option value="ordem">Ordem da loja</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
          <option value="nome">Nome (A-Z)</option>
        </select>
      </div>

      <div class="grid" id="grade"></div>

      <div class="loadmore" id="rodapeLista"></div>
    </div>
  </main>

  <script type="module" src="js/categoria.js"></script>
</body>
</html>
